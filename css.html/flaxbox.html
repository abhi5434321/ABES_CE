<!DOCTYPE html>
<html lang="en">
<head>
    <style>
        .aa {
            display: flex;
            gap: 20px;
            justify-content: center;
            margin-top: 40px;
        }
        .card-option {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .adi {
            border: 2px solid #333;
            height: 250px;
            width: 150px;
            background-color: brown;
            color: white;
            font-size: 30px;
            padding: 20px 10px 10px 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            border-radius: 10px;
            box-shadow: 2px 2px 8px #888;
        }
        .adi img {
            width: 80px;
            height: 80px;
            object-fit: cover;
            border-radius: 8px;
            margin-bottom: 10px;
            background: #fff;
        }
        .cart-btn {
            margin-top: 10px;
            padding: 8px 12px;
            font-size: 16px;
            background: #fff;
            color: rgb(69, 42, 165);
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .cart-btn:hover {
            background: #f0cfcf;
        }
        .note {
            font-size: 12px;
            color: #ffe4b5;
            margin-top: 8px;
            text-align: center;
        }
        .option-label {
            font-size: 18px;
            color: #333;
            margin-bottom: 10px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="aa">
        <div class="card-option">
            <div class="option-label">Option 1</div>
            <div class="adi">
                <img src="http://a.mktgcdn.com/p/d9AXTJEWMZ156q11dLLVRHsmufNu0K-ng4JYb_4WwRI/4500x3381.jpg" alt="Pizza">
                pizza
                <button class="cart-btn">Add to Cart</button>
                <div class="note">Click to add pizza to cart</div>
            </div>
        </div>
        <div class="card-option">
            <div class="option-label">Option 2</div>
            <div class="adi">
                <img src="https://i5.walmartimages.com/seo/Coca-Cola-Classic-Coke-Soft-Drink-Ready-to-Drink-12-fl-oz-355-mL-Can-24-Carton-Bundle-of-2-Cartons_72180074-d19e-4357-a6a0-0306aec70bac.85132b04b7ae870a904b668071435a13.jpeg" alt="Coke">
                coke
                <button class="cart-btn">Add to Cart</button>
                <div class="note">Click to add coke to cart</div>
            </div>
        </div>
        <div class="card-option">
            <div class="option-label">Option 3</div>
            <div class="adi">
                <img src="https://5.imimg.com/data5/SELLER/Default/2023/12/368942421/ZP/BF/QE/27504157/campa-cola-cold-drink-1000x1000.jpeg" alt="Redbull">
                Redbull
                <button class="cart-btn">Add to Cart</button>
                <div class="note">Click to add Redbull to cart</div>
            </div>
        </div>
    </div>
</body>
</html>
