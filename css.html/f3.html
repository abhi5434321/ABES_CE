<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Counter App</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      background-color: #f4f4f4;
    }

    .app-container {
      border: 2px solid #000;
      padding: 30px;
      border-radius: 10px;
      background-color: white;
      box-shadow: 0 0 10px rgba(0,0,0,0.2);
      text-align: center;
    }

    .logo {
      width: 60px;
      height: 60px;
      margin-bottom: 15px;
      border-radius: 50%;
      object-fit: cover;
      box-shadow: 0 2px 8px #888;
    }

    h1 {
      margin-bottom: 20px;
    }

    .counter-value {
      font-size: 48px;
      margin: 20px 0;
    }

    .buttons {
      display: flex;
      gap: 20px;
      justify-content: center;
    }

    button {
      padding: 10px 20px;
      font-size: 20px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="app-container">
    <img src="https://cdn-icons-png.flaticon.com/512/992/992700.png" alt="App Logo" class="logo">
    <h1>Counter App</h1>
    <div class="counter-value" id="counter">0</div>
    <div class="buttons">
      <button onclick="decrement()">-</button>
      <button onclick="increment()">+</button>
    </div>
  </div>

  <script>
    let count = 0;

    function increment() {
      if (count >= 10) {
        alert("Max limit reached");
        return;
      }
      count++;
      updateDisplay();
    }

    function decrement() {
      if (count <= 0) {
        alert("Min limit reached");
        return;
      }
      count--;
      updateDisplay();
    }

    function updateDisplay() {
      document.getElementById('counter').textContent = count;
    }
  </script>

</body>
</html>
